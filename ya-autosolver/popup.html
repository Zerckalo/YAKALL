<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: sans-serif; width: 280px; padding: 10px; }
    label { display: block; margin-top: 8px; font-size: 12px; }
    input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; margin-top: 2px; }
    button { margin-top: 12px; width: 100%; padding: 6px; }
  </style>
</head>
<body>
  <label><input type="checkbox" id="enabled" /> Включить авто-решение</label>
  <label><input type="checkbox" id="autoSubmit" /> Нажимать «Ответить» автоматически</label>
  <label>API URL:<input type="text" id="apiUrl" /></label>
  <label>Model:<input type="text" id="model" /></label>
  <label>API Key:<input type="password" id="apiKey" /></label>
  <button id="save">Сохранить</button>
  <div id="status" style="margin-top:6px;font-size:12px;"></div>
  <script src="popup.js"></script>
</body>
</html>
